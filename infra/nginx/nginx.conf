user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid   /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Trust forwarded client IP only from private ranges (LB/ingress in front of nginx).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","host":"$host","uri":"$request_uri","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_cache_status":"$upstream_cache_status","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml font/ttf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Zone names must differ across modules: nginx rejects one name used by both limit_req and proxy_cache.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=30r/s;

    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:20m max_size=1g inactive=10m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
