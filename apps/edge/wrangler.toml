# Edge gateway. Deploy: pnpm --filter @luxury-pos/edge deploy (after `pnpm --filter @luxury-pos/pos build:web`).
name = "luxury-pos-edge"
main = "src/index.ts"
compatibility_date = "2026-10-13"
upload_source_maps = true

[assets]
directory = "../pos/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/edge/*"]

[vars]
PRIMARY_ORIGIN = "https://api-origin.example.com"
# FALLBACK_ORIGIN = "https://django-origin.example.com"
# Move one bounded context at a time to another backend:
# ROUTE_RULES = '[{"prefix":"/api/insights","origin":"fallback"}]'

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "7101"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "7102"
  [ratelimits.simple]
  limit = 600
  period = 60

[observability]
enabled = true
