name: Database backup

on:
  schedule:
    - cron: "17 2 * * *" # daily 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted Postgres backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check BACKUP_DATABASE_URL present
        id: check
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -n "$BACKUP_DATABASE_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BACKUP_DATABASE_URL not set; skipping backup."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Install PostgreSQL 17 client (PGDG) and age
        if: steps.check.outputs.present == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age
          pg_dump --version

      - name: Run backup
        if: steps.check.outputs.present == 'true'
        run: bash scripts/backup.sh
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_DIR: ./backups
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}

      - name: Remove local backup files
        if: always() && steps.check.outputs.present == 'true'
        run: rm -rf ./backups
