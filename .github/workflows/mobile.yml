name: Mobile EAS build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options: [ios, android, all]
        default: all
        required: true
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  eas-build:
    name: EAS build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check EXPO_TOKEN present
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EXPO_TOKEN not set; skipping EAS build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Setup EAS
        if: steps.check.outputs.present == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue EAS build
        if: steps.check.outputs.present == 'true'
        working-directory: apps/pos
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
